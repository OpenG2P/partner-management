name: Publish Partner Management Dockers

# Builds the images from the LOCAL in-repo source (core/ and ui/). The image tag
# is the repository ref (branch name or git tag). External OpenG2P libs are not in
# this repo; their ref is a workflow_dispatch input (default below).
on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - 'core/**'
      - 'ui/**'
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      fastapi_common_ref:
        description: "openg2p-fastapi-common git ref (tag/branch)"
        default: "develop"
        type: string

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Docker - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: staff-portal-api
            image: openg2p/partner-management-staff-portal-api
            dockerfile: docker/staff-portal-api/Dockerfile
          - name: partner-api
            image: openg2p/partner-management-partner-api
            dockerfile: docker/partner-api/Dockerfile
          - name: staff-portal-ui
            image: openg2p/partner-management-staff-portal-ui
            dockerfile: docker/staff-portal-ui/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_actor }}
          password: ${{ secrets.docker_hub_token }}

      - name: Derive image tag from repo ref
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push - ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: |
            FASTAPI_COMMON_REF=${{ inputs.fastapi_common_ref || 'develop' }}
          tags: ${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.repository }}@${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=OpenG2P Partner Management service image
            org.openg2p.service.name=${{ matrix.name }}
