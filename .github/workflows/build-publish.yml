name: Build & Publish

# Replaces docker-build.yml + helm-publish.yml.
#
# One workflow, not two: a UI/backend-only change must still republish the chart,
# or the newest chart keeps pointing at the previous image. The old pair had
# disjoint path filters, so that desync was routine.
#
# This file declares only what THIS repo contains. All versioning policy lives
# in openg2p-packaging behind @v1 -- see that repo's ci/README.md.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  # These inputs are for two occasional changelog fixes only. For a normal run,
  # leave the checkbox OFF and the text box EMPTY (it rebuilds/publishes the
  # selected branch as usual).
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only (use when AI is unavailable). Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a release that published without one: enter its frozen version e.g. 1.0.1 (not a develop version). Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  build-publish:
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}
      # `pins` are per-image: the two API Dockerfiles declare ARG
      # FASTAPI_COMMON_REF, and `1.2` is a BRANCH -- without resolving it to a
      # SHA, two builds of the same commit produce different images. The UI
      # Dockerfile has no git-ref ARG, so it needs no pins.
      images: |
        [
          {"name": "staff-portal-api",
           "repo": "openg2p/partner-management-staff-portal-api",
           "dockerfile": "docker/staff-portal-api/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF",
              "repo": "https://github.com/openg2p/openg2p-fastapi-common",
              "ref": "1.2"}
           ]},

          {"name": "partner-api",
           "repo": "openg2p/partner-management-partner-api",
           "dockerfile": "docker/partner-api/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF",
              "repo": "https://github.com/openg2p/openg2p-fastapi-common",
              "ref": "1.2"}
           ]},

          {"name": "staff-portal-ui",
           "repo": "openg2p/partner-management-staff-portal-ui",
           "dockerfile": "docker/staff-portal-ui/Dockerfile"}
        ]

      chart-path: deployment/charts/partner-management

      # Every OpenG2P image the chart deploys. jbergknoff/postgresql-client
      # (db-password-sync) is third-party and stays pinned in values.yaml.
      chart-image-paths: |
        [".staffPortalApi.image.tag",
         ".partnerApi.image.tag",
         ".staffPortalUi.image.tag"]

      packaging-ref: v1

    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      # Org-level secret; if unset the changelog still publishes human notes.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
